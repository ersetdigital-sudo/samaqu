<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMAQU Affiliate Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>:root{--pri:#111827;--pri-d:#000000;--soft:#E5E7EB;--soft2:#F3F4F6;--bg:#F9FAFB;--tx:#374151;--tx2:#6B7280;--bd:#E5E7EB;--ok:#047857;--okbg:#ECFDF5;--warn:#B45309;--warnbg:#FFFBEB;--err:#B91C1C;--errbg:#FEF2F2;--info:#1D4ED8;--infobg:#EFF6FF;--r:14px;--sh:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.04)}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}svg.i.lg{width:22px;height:22px}
/* layout */
.app{display:flex;min-height:100vh}
.sb{width:248px;background:#fff;border-right:1px solid var(--bd);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:width .2s,transform .2s}
.sb.col{width:76px}
.main{flex:1;margin-left:248px;min-width:0;transition:margin .2s}
.app.colp .main{margin-left:76px}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.brand b{display:block;font-size:17px;letter-spacing:.06em;color:#111827}
.brand small{display:block;font-size:10px;letter-spacing:.16em;color:var(--pri);font-weight:700}
.prof{margin:4px 14px 10px;padding:12px;border:1px solid var(--bd);border-radius:12px;display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.prof .n{font-weight:700;font-size:13px;color:#111827;white-space:nowrap}
.prof .id{font-size:11px;color:var(--tx2)}
.nav{flex:1;overflow-y:auto;padding:2px 12px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav .lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:#9CA3AF;padding:8px 10px 4px}
.ni{display:flex;align-items:center;gap:11px;padding:7px 10px;border-radius:10px;color:var(--tx2);font-weight:600;font-size:13.5px;cursor:pointer;position:relative;white-space:nowrap;width:100%;background:none;border:0;text-align:left}
.ni:hover{background:var(--bg);color:var(--tx)}
.ni.on{background:var(--soft);color:var(--pri)}
.ni .cnt{margin-left:auto;background:var(--pri);color:#fff;font-size:10.5px;border-radius:99px;padding:1px 7px}
.sb.col .ni span,.sb.col .brand div,.sb.col .prof>div:not(.av),.sb.col .nav .lbl,.sb.col .ni .cnt{display:none}
.sb.col .ni{justify-content:center}.sb.col .prof{justify-content:center;padding:8px;border:0}
.sb.col .ni:hover::after{content:attr(data-tip);position:absolute;left:62px;background:#111827;color:#fff;font-size:12px;padding:5px 9px;border-radius:7px;z-index:60}
.sbf{border-top:1px solid var(--bd);padding:10px 12px}
.ovl{display:none}
/* header */
.hd{height:68px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:30}
.hd h1{font-size:17px;font-weight:700;color:#111827;line-height:1.2}
.bc{font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center}
.bc a:hover{color:var(--pri)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--tx)}
.iconbtn:hover{background:var(--bg)}
.dot{position:absolute;top:-5px;right:-5px;background:var(--pri);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;border:2px solid #fff}
.dd{position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 12px 32px rgba(17,24,39,.1);min-width:220px;padding:6px;z-index:50}
.dd button,.dd a{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;font-weight:500;text-align:left}
.dd button:hover,.dd a:hover{background:var(--bg)}
.content{padding:26px 28px 48px;max-width:1240px;margin:0 auto}
/* primitives */
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.cp{padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.ch h3{font-size:15px;font-weight:700;color:#111827}
.ch p{font-size:12.5px;color:var(--tx2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.mt{margin-top:16px}.mt2{margin-top:24px}
.row{display:flex;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--tx2)}.small{font-size:12px}.b{font-weight:700}.dark{color:#111827}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn.p{background:var(--pri);color:#fff}.btn.p:hover{background:var(--pri-d)}
.btn.s{background:#fff;border-color:var(--bd);color:var(--tx)}.btn.s:hover{background:var(--bg)}
.btn.g{background:none;color:var(--pri);padding:0 8px}.btn.g:hover{background:var(--soft2)}
.btn.d{background:var(--err);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.w{width:100%}
.inp,.sel,textarea.inp{height:40px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:#fff;width:100%;outline:none}
textarea.inp{height:auto;padding:10px 12px;min-height:80px;resize:vertical}
.inp:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(17,24,39,.12)}
.inp.e,.sel.e{border-color:#F87171}
.fl{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:#111827}
.fe{color:var(--err);font-size:12px;margin-top:5px}
.fh{color:var(--tx2);font-size:12px;margin-top:5px}
.fg{margin-bottom:14px}
.search{position:relative;min-width:220px}.search svg{position:absolute;left:11px;top:11px;color:#9CA3AF}.search .inp{padding-left:36px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-err{background:var(--errbg);color:var(--err)}.b-info{background:var(--infobg);color:var(--info)}.b-gray{background:#F3F4F6;color:#4B5563}.b-pri{background:var(--soft2);color:var(--pri)}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--pri);color:#fff;letter-spacing:.02em}
.tag.n{background:#6B7280}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 12px;font-weight:600;color:var(--tx2);border:0;background:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:13.5px}
.tab.on{color:var(--pri);border-color:var(--pri)}
.tab .c{font-size:11px;background:#F3F4F6;color:var(--tx2);padding:1px 7px;border-radius:99px;margin-left:5px}
.tab.on .c{background:var(--soft);color:var(--pri)}
.seg{display:inline-flex;background:#F3F4F6;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--tx2);cursor:pointer}
.seg button.on{background:#fff;color:var(--pri);box-shadow:var(--sh)}
/* stat */
.stat{padding:18px 20px}
.stat .top{display:flex;justify-content:space-between;align-items:flex-start}
.stat .ic{width:38px;height:38px;border-radius:10px;background:var(--soft2);color:var(--pri);display:grid;place-items:center}
.stat .lb{color:var(--tx2);font-weight:600;font-size:12.5px}
.stat .v{font-size:24px;font-weight:800;color:#111827;margin-top:12px;letter-spacing:-.01em}
.stat .sub{font-size:12px;color:var(--tx2);margin-top:4px}
.delta{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.delta.up{background:var(--okbg);color:var(--ok)}.delta.dn{background:var(--errbg);color:var(--err)}
/* table */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;background:#FAFAFB;border-bottom:1px solid var(--bd);white-space:nowrap}
.t th.so{cursor:pointer}.t th.so:hover{color:var(--pri)}
.t td{padding:12px 14px;border-bottom:1px solid #F1F2F4;white-space:nowrap;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:#FCFCFD}
.t .num{text-align:right}
.thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#F3F4F6;flex:none}
.pg{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--bd);gap:10px;flex-wrap:wrap}
.pg .ps{display:flex;gap:4px}
.pg button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:600;font-size:12.5px}
.pg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pg button:disabled{opacity:.4;cursor:default}
.empty{padding:48px 20px;text-align:center;color:var(--tx2)}
.empty .ei{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:var(--soft2);color:var(--pri);display:grid;place-items:center}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
.filters .sel{width:auto;min-width:150px}
/* product card */
.pc{overflow:hidden;display:flex;flex-direction:column}
.pc .im{aspect-ratio:1/1;background:#F3F4F6;position:relative;cursor:pointer;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.pc:hover .im img{transform:scale(1.03)}
.pc .im .tag{position:absolute;top:10px;left:10px}
.pc .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .nm{font-weight:700;color:#111827;font-size:13.5px;line-height:1.35;min-height:36px}
.pc .pr{font-weight:800;color:#111827;font-size:15px}
.cmb{background:var(--soft2);border-radius:9px;padding:8px 10px;font-size:12px;display:flex;justify-content:space-between}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:80;display:grid;place-items:center;padding:20px;animation:f .15s}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(17,24,39,.2);animation:u .18s}
.md.lg{max-width:860px}.md.sm{max-width:420px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--bd)}
.mh h3{font-size:16px;font-weight:700;color:#111827}
.mb{padding:20px 22px;overflow-y:auto}
.mf{padding:14px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@keyframes f{from{opacity:0}}@keyframes u{from{opacity:0;transform:translateY(8px)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px}.kv dt{color:var(--tx2)}.kv dd{font-weight:600;color:#111827;text-align:right}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px}
.note{background:var(--warnbg);color:#92400E;border:1px solid #FDE68A;border-radius:12px;padding:11px 14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
.note.i{background:var(--infobg);color:#1E40AF;border-color:#BFDBFE}
.tl{position:relative;padding-left:20px}.tl li{list-style:none;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:-16px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--soft)}
.tl li::after{content:"";position:absolute;left:-12px;top:16px;bottom:0;width:2px;background:var(--bd)}
.tl li:last-child::after{display:none}
/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18);animation:u .2s;max-width:360px}
.toast.ok svg{color:#6EE7B7}.toast.err svg{color:#FCA5A5}
/* misc */
.list-i{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid #F1F2F4;align-items:flex-start}
.list-i:last-child{border-bottom:0}
.aic{width:34px;height:34px;border-radius:10px;background:var(--soft2);color:var(--pri);display:grid;place-items:center;flex:none}
.qa{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:16px;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;text-align:left;transition:border .15s}
.qa:hover{border-color:var(--pri)}
.sk{background:linear-gradient(90deg,#F3F4F6,#E5E7EB,#F3F4F6);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}
.acc{border:1px solid var(--bd);border-radius:12px;background:#fff;margin-bottom:8px}
.acc button.q{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:0;background:none;font-weight:600;text-align:left;cursor:pointer;gap:12px;color:#111827}
.acc .a{padding:0 16px 14px;color:var(--tx2);line-height:1.6}
.sw{width:40px;height:22px;border-radius:99px;background:#D1D5DB;position:relative;border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--pri)}.sw.on::after{left:21px}
.chk{accent-color:var(--pri);width:16px;height:16px}
.sim{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--tx2);background:#fff;border:1px dashed var(--bd);padding:4px 10px;border-radius:99px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--tx2)}
.chip.on{background:var(--soft);border-color:var(--soft);color:var(--pri)}
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth .side{background:var(--soft2);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:48px}
.auth .side img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}
.auth .side .cap{position:relative;background:rgba(255,255,255,.92);border-radius:16px;padding:22px;max-width:420px}
.auth .frm{display:grid;place-items:center;padding:32px}
.auth .frm>div{width:100%;max-width:400px}
.pwd{position:relative}.pwd button{position:absolute;right:8px;top:8px;border:0;background:none;cursor:pointer;color:var(--tx2)}
.hide-m{}.show-m{display:none!important}
@media(max-width:1100px){.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)!important}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){
.sb{transform:translateX(-100%);width:268px!important}.sb.open{transform:none}
.sb.col .ni span,.sb.col .brand div,.sb.col .prof>div:not(.av),.sb.col .nav .lbl{display:initial}
.main,.app.colp .main{margin-left:0}
.ovl.show{display:block;position:fixed;inset:0;background:rgba(17,24,39,.4);z-index:35}
.hd{padding:0 16px}.content{padding:18px 16px 40px}
.hide-m{display:none!important}.show-m{display:inline-flex!important}
.auth{grid-template-columns:1fr}.auth .side{display:none}
.g2,.g3{grid-template-columns:minmax(0,1fr)}.content>*{min-width:0}
.filters .sel,.search{width:100%;min-width:0}
.mbg{padding:10px;place-items:end center}.md{max-height:92vh}
.toasts{left:16px;right:16px;bottom:16px}
}
@media(max-width:480px){.g4,.g5,.g6.pg6{grid-template-columns:1fr 1fr}.stat .v{font-size:19px}.stat{padding:14px}}

.t td .row .b.dark{min-width:150px}
</style>
</head>
<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;gap:10px;font-family:system-ui,sans-serif;color:#6B7280"><span style="width:18px;height:18px;border:2px solid #E5E7EB;border-top-color:#111827;border-radius:50%;animation:sp .7s linear infinite"></span>Memuat…</div><style>@keyframes sp{to{transform:rotate(360deg)}}</style></div>
<div id="imgsrc" hidden aria-hidden="true">
<img id="im-shirt" src="https://moda.app/api/v2/images/ref/8a4723c6-cba8-4934-a505-ee12082b4eaf?v=597e61f5cd3b435c" alt="" loading="lazy" decoding="async"><img id="im-tee" src="https://moda.app/api/v2/images/ref/0f4691fb-4a7d-419e-866f-271d7318b9f9?v=785d8d1267a62184" alt="" loading="lazy" decoding="async"><img id="im-chino" src="https://moda.app/api/v2/images/ref/f80152b8-f61b-4d1b-ad6d-bd6ee55e35a8?v=1e7590f292ed9b49" alt="" loading="lazy" decoding="async">
<img id="im-jacket" src="https://moda.app/api/v2/images/ref/640fbbc7-2b26-4081-af4f-5106c4f0b57f?v=30b9ac4da4a57994" alt="" loading="lazy" decoding="async"><img id="im-gamis" src="https://moda.app/api/v2/images/ref/ef21e189-4472-4271-b043-3383df02c937?v=e18dbd4d24df8ce0" alt="" loading="lazy" decoding="async"><img id="im-bag" src="https://moda.app/api/v2/images/ref/59024947-d14f-4483-91ab-5d695d29feaf?v=b30084d57c0a48c3" alt="" loading="lazy" decoding="async">
</div>
<div id="modal"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script>/* SAMAQU Affiliate Center — sumber data simulasi terpusat (deterministik, bukan data asli SAMAQU) */
(function(){
const IMG={
shirt:"https://moda.app/api/v2/images/ref/8a4723c6-cba8-4934-a505-ee12082b4eaf?v=597e61f5cd3b435c",
tee:"https://moda.app/api/v2/images/ref/0f4691fb-4a7d-419e-866f-271d7318b9f9?v=785d8d1267a62184",
chino:"https://moda.app/api/v2/images/ref/f80152b8-f61b-4d1b-ad6d-bd6ee55e35a8?v=1e7590f292ed9b49",
jacket:"https://moda.app/api/v2/images/ref/640fbbc7-2b26-4081-af4f-5106c4f0b57f?v=30b9ac4da4a57994",
gamis:"https://moda.app/api/v2/images/ref/ef21e189-4472-4271-b043-3383df02c937?v=e18dbd4d24df8ce0",
bag:"https://moda.app/api/v2/images/ref/59024947-d14f-4483-91ab-5d695d29feaf?v=b30084d57c0a48c3"};

PAGES.performa=function(){const r=range(ui.period,ui.custom);const pr=prevRange(r);const m=metrics(r),pm=metrics(pr);const cmp=ui.pf.compare==="1";const dl=v=>cmp?v:undefined;
 const grp=(keyOf,labelOf,clicksOf)=>{const g={};m.os.forEach(o=>{const k=keyOf(o);g[k]=g[k]||{k,orders:0,sales:0,comm:0};g[k].orders++;if(OK_SALE(o))g[k].sales+=DB.orderValue(o);const c=DB.comm(o.id);if(c.status!=="Tidak Disetujui")g[k].comm+=c.amount});
  return Object.entries(clicksOf()).map(([k,cl])=>({k,label:labelOf(k),clicks:cl,orders:(g[k]||{}).orders||0,sales:(g[k]||{}).sales||0,comm:(g[k]||{}).comm||0})).filter(x=>x.clicks||x.orders).sort((a,b)=>b.comm-a.comm||b.clicks-a.clicks)};
 const allLinks=D.links.concat(S.links.filter(l=>l.user));
 const by={produk:()=>grp(o=>DB.link(o.linkId).productId,k=>DB.product(k).name,()=>{const c={};D.links.forEach(l=>c[l.productId]=(c[l.productId]||0)+linkClicks(l,r));return c}),
  tautan:()=>grp(o=>o.linkId,k=>{const l=DB.link(k);return l.code+" · "+l.campaign},()=>Object.fromEntries(allLinks.map(l=>[l.id,linkClicks(l,r)]))),
  kampanye:()=>grp(o=>DB.link(o.linkId).campaign,k=>k,()=>{const c={};allLinks.forEach(l=>c[l.campaign]=(c[l.campaign]||0)+linkClicks(l,r));return c}),
  sumber:()=>grp(o=>DB.link(o.linkId).source,k=>k,()=>{const c={};allLinks.forEach(l=>c[l.source]=(c[l.source]||0)+linkClicks(l,r));return c})}[ui.pf.by]();
 const charts=[["clicks","Klik per Hari",false,"line"],["orders","Pesanan per Hari",false,"bar"],["sales","Penjualan per Hari",true,"line"],["comm","Komisi per Hari",true,"bar"]];
 return{title:"Performa",html:`<div class="row between wrap" style="margin-bottom:16px;gap:12px"><div class="row wrap">${C.period()}<label class="row small b" style="gap:8px;cursor:pointer"><button class="sw ${cmp?"on":""}" data-a="set" data-k="pf.compare" data-v="${cmp?"0":"1"}" aria-label="Bandingkan"></button>Bandingkan dengan periode sebelumnya</label></div>${C.sim()}</div>

 <div class="grid g2 mt">${charts.map(c=>`<div class="card"><div class="ch"><h3>${c[1]}</h3><span class="small muted">${periodLabel()}</span></div><div class="cp"><div style="height:220px"><canvas id="pf-${c[0]}"></canvas></div></div></div>`).join("")}</div>
 <div class="card mt"><div class="ch"><h3>Performa Berdasarkan</h3><div class="seg">${[["produk","Produk"],["tautan","Tautan"],["kampanye","Kampanye"],["sumber","Sumber Promosi"]].map(([k,l])=>`<button class="${ui.pf.by===k?"on":""}" data-a="set" data-k="pf.by" data-v="${k}">${l}</button>`).join("")}</div></div>
 ${C.table([{label:{produk:"Produk",tautan:"Tautan",kampanye:"Kampanye",sumber:"Sumber"}[ui.pf.by],render:x=>`<span class="b dark" style="white-space:normal">${esc(x.label)}</span>`},{label:"Klik",num:1,render:x=>num(x.clicks)},{label:"Pesanan",num:1,render:x=>x.orders},{label:"Konversi",num:1,render:x=>x.clicks?(x.orders/x.clicks*100).toFixed(2).replace(".",",")+"%":"—"},{label:"Penjualan",num:1,render:x=>rp(x.sales)},{label:"Komisi",num:1,render:x=>`<b class="dark">${rp(x.comm)}</b>`}],{rows:by,total:by.length,page:1,pages:1,size:by.length},"pfx",{nopg:1,emptyIcon:"chart",emptyTitle:"Belum ada data pada periode ini"})}</div>`,
